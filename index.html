];
let current=0, answers=Array(questions.length).fill(null);
const $=id=>document.getElementById(id);
function show(section){["home","quiz","result"].forEach(id=>$(id).classList.toggle("hidden",id!==section));window.scrollTo({top:0,behavior:"smooth"});}
function renderQuestion(){
 const item=questions[current];$("counter").textContent=String(current+1).padStart(2,"0")+" / "+questions.length;
 $("progress").style.width=((current+1)/questions.length*100)+"%";
 $("qNumber").textContent="QUESTION "+String(current+1).padStart(2,"0");
 $("questionText").textContent=item.q;
 $("options").innerHTML="";
 item.options.forEach((opt,i)=>{
  const btn=document.createElement("button");btn.className="option"+(answers[current]===i?" selected":"");
  const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);
  const label=document.createElement("span");label.textContent=opt.text;btn.append(letter,label);
  btn.addEventListener("click",()=>{answers[current]=i;renderQuestion();});
  $("options").appendChild(btn);
 });
 $("prevBtn").disabled=current===0;$("prevBtn").style.opacity=current===0?".4":"1";
 $("nextBtn").disabled=answers[current]===null;
 $("nextBtn").textContent=current===questions.length-1?"查看我的结果 ✨":"下一题 →";
 const area=$("questionArea");area.classList.remove("fade");void area.offsetWidth;area.classList.add("fade");
}
function calculate(){
 const scores=[0,0,0,0,0];
 answers.forEach((choice,qi)=>{const v=questions[qi].options[choice].score;v.forEach((n,i)=>scores[i]+=n);});
 // Stable tie-break: prefer the dimension with the strongest answer count, then fixed order.
 let max=Math.max(...scores), winner=scores.indexOf(max);
 const totals=scores.map((s,i)=>({s,i})).filter(x=>x.s===max);
 if(totals.length>1){let counts=[0,0,0,0,0];answers.forEach((a,qi)=>counts[questions[qi].options[a].score.indexOf(3)]++);winner=totals.sort((a,b)=>counts[b.i]-counts[a.i]||a.i-b.i)[0].i;}
 return {winner,scores};
}
function showResult(){
 const {winner,scores}=calculate(),t=types[winner];
 $("resultEmoji").textContent=t.emoji;$("resultTitle").textContent="你的吸引力类型："+t.name;$("tagline").textContent=t.quote;
 const cards=[["性格特点",t.traits],["为什么容易吸引这种人？",t.reason],["你的隐藏优势",t.advantage],["趣味彩蛋",t.easter]];
 $("resultBody").innerHTML="";
 cards.forEach((c,i)=>{const box=document.createElement("div");box.className="result-card tint"+(i+1);const h=document.createElement("h3");h.textContent=c[0];const p=document.createElement("p");p.textContent=c[1];box.append(h,p);$("resultBody").append(box);});
 $("stats").innerHTML=scores.map((s,i)=>`<div class="stat"><b>${s}</b><span>${dimensions[i]}</span></div>`).join("");
 show("result");
}
$("startBtn").addEventListener("click",()=>{current=0;answers=Array(questions.length).fill(null);show("quiz");renderQuestion();});
$("prevBtn").addEventListener("click",()=>{if(current>0){current--;renderQuestion();}});
$("nextBtn").addEventListener("click",()=>{if(answers[current]===null)return;if(current<questions.length-1){current++;renderQuestion();}else showResult();});
$("restartBtn").addEventListener("click",()=>{current=0;answers=Array(questions.length).fill(null);show("home");});
$("shareBtn").addEventListener("click",async()=>{
 const {winner}=calculate(),t=types[winner];
 const shareText=`我测出的恋爱吸引力类型是「${t.name}」${t.emoji}\n${t.quote}\n来测测你容易吸引什么样的恋人！`;
 try{if(navigator.share){await navigator.share({title:"你容易吸引什么样的恋人",text:shareText});}
 else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(shareText);$("shareBtn").textContent="结果文案已复制 ✓";}
 else{window.prompt("复制你的测试结果：",shareText);}}
 catch(e){if(e.name!=="AbortError")window.prompt("复制你的测试结果：",shareText);}
});
</script>
